<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100 Books App</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="app" id="app">
  
  <!-- ====================================================
       共有ヘッダー
       ==================================================== -->

  <header class="header">

    <!-- 左側：リスト選択 -->
    <div class="header-left">

      <select id="list-select" class="list-select">
        <!-- JSから動的に選択肢を追加 -->
      </select>

    </div>


    <!-- ==================================================
         右側：コントロール群
         ================================================== -->

    <div class="header-right">


      <!-- CLEAR -->

      <button
        id="clear-btn"
        class="header-btn"
        type="button">
        CLEAR
      </button>


      <!-- THEME -->

      <div class="dropdown-wrapper">

        <button
          id="theme-menu-btn"
          class="header-btn"
          type="button">
          THEME ▼
        </button>

        <div
          id="theme-dropdown"
          class="dropdown-menu hidden">

          <button
            class="sort-option"
            id="theme-default"
            type="button">
            ORANGE
          </button>

          <button
            class="sort-option"
            id="theme-blue"
            type="button">
            BLUE
          </button>

          <button
            class="sort-option"
            id="theme-green"
            type="button">
            GREEN
          </button>

        </div>

      </div>


      <!-- JP / EN -->

      <button
        id="language-btn"
        class="header-btn"
        type="button">
        JP / EN
      </button>


      <!-- SORT -->

      <div class="dropdown-wrapper">

        <button
          id="sort-menu-btn"
          class="header-btn"
          type="button">
          SORT ▼
        </button>

        <div
          id="sort-dropdown"
          class="dropdown-menu hidden">

          <button
          class="sort-option"
          id="sort-list-order"      
          type="button">      
          Default
          </button>

          <button
            class="sort-option"
            id="sort-alphabet"
            type="button">
            A → Z
          </button>

          <button
            class="sort-option"
            id="sort-status"
            type="button">
            Read
          </button>

          <button
            class="sort-option"
            id="sort-random"
            type="button">
            Random
          </button>

        </div>

      </div>


      <!-- MODE -->

      <button
      id="mode-btn"
      class="mode-toggle-btn"
      type="button"
      title="モード切り替え">

      <img
        class="book-icon"
        src="./images/mode-button.png"
        alt=""
      >

      </button>

    </div>

  </header>



  <!-- ====================================================
       メイン表示エリア
       ==================================================== -->

  <main
    class="main-container view-mode"
    id="main-container">


    <!-- ==================================================
         レイアウト空間
         ================================================== -->

    <div
      class="layout-space"
      id="layout-space">


      <!-- ==================================================
           左側の本棚表示窓
           ================================================== -->

      <div
        class="bookshelf-window left-window"
        id="left-window">

        <div
          class="bookshelf"
          id="bookshelf-left">
        </div>

      </div>



      <!-- ==================================================
           詳細ビュー
           ================================================== -->

      <div
        class="detail-panel hidden"
        id="detail-panel">


        <!-- ステータス ＆ レーティング -->

        <div class="status-rating">


          <!-- 本アイコン -->

          <button
          id="detail-book-icon"
          class="detail-book-icon"
          type="button">
        
            <span
              class="detail-book-image">
            </span>
          
            <span id="detail-book-title">
              本のタイトル
            </span>
          
          </button>

          <!-- レーティング -->

          <div
            id="rating-control"
            class="rating-control">

            <button
              class="rating-star"
              data-rating="1"
              type="button">
              ★
            </button>

            <button
              class="rating-star"
              data-rating="2"
              type="button">
              ★
            </button>

            <button
              class="rating-star"
              data-rating="3"
              type="button">
              ★
            </button>

            <button
              class="rating-star"
              data-rating="4"
              type="button">
              ★
            </button>

            <button
              class="rating-star"
              data-rating="5"
              type="button">
              ★
            </button>

          </div>

        </div>



        <!-- 本の詳細情報 ＆ ノート -->

        <div class="panel-info">

          <h2
            id="detail-title"
            class="book-detail-title">
            本のタイトル
          </h2>

          <p
            id="detail-author"
            class="book-detail-author">
            著者名
          </p>


          <!-- メモ -->

          <div class="memo-box">

            <label for="detail-memo">
              Note
            </label>

            <textarea
              id="detail-memo"
              placeholder="...">
            </textarea>

          </div>

        </div>


        <!-- List Panel -->

        <button
          id="list-panel-btn"
          class="list-panel-btn"
          type="button">
          List Panel
        </button>

      </div>



      <!-- ==================================================
           右側の本棚表示窓
           ================================================== -->

      <div
        class="bookshelf-window right-window"
        id="right-window">

        <div
          class="bookshelf"
          id="bookshelf-right">
        </div>


        <!-- List Panel -->

        <div
          class="list-panel hidden"
          id="list-panel">
        </div>

      </div>


    </div>

  </main>



  <!-- ====================================================
       読破数カウント
       ==================================================== -->

  <div class="footer-count">

    <span id="read-count">
      0
    </span>

    <span class="total">
      /100
    </span>

  </div>



  <!-- ====================================================
       JavaScript
       ==================================================== -->

  <script src="js/books.js"></script>
  <script src="js/lists.js"></script>
  <script src="js/app.js"></script>

</div>
</body>

</html>
